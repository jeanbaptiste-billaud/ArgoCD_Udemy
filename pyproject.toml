[project]
name = "predict"
version = "0.1.0"
description = "API de prediction California housing : entrainement (MLflow) et packaging (BentoML)"
requires-python = ">=3.12,<3.13"
# Memes versions que l'image (service/bentofile.yaml) : le modele serialise doit etre relu
# avec le scikit-learn qui l'a produit. mlflow-skinny : client seul, meme version que le
# serveur MLflow du cluster.
dependencies = [
    "bentoml==1.4.40",
    "mlflow-skinny==3.16.0",
    "scikit-learn==1.9.1",
    "pandas",
    "psycopg[binary]==3.3.8",
    "skops==0.16.0",
]

[tool.uv]
package = false
