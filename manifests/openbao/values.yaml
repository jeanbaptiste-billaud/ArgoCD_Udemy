global:
  enabled: true
  tlsDisable: true

injector:
  enabled: false

server:
  replicas: 1

  image:
    registry: quay.io
    repository: openbao/openbao

  dataStorage:
    enabled: true
    size: 5Gi
    storageClass: microk8s-hostpath

  service:
    enabled: true
    type: NodePort
    nodePort: 30200
    port: 8200
    targetPort: 8200

  dev:
    enabled: false

  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "file" {
        path = "/openbao/data"
      }

ui:
  enabled: false