# SeaweedFS minimal : un seul pod "all-in-one" (master + volume + filer + S3)
# Sert de stockage d'artefacts S3 pour MLflow.

# Les composants separes sont actives par defaut dans le chart : on les coupe
master:
  enabled: false
volume:
  enabled: false
filer:
  enabled: false

allInOne:
  enabled: true
  replicas: 1

  # Stockage persistant (PVC unique pour master, volumes et metadonnees filer)
  data:
    type: persistentVolumeClaim
    size: 10Gi
    storageClass: microk8s-hostpath

  s3:
    enabled: true
    port: 8333
    enableAuth: true
    # Secret cree par l'ExternalSecret de workloads/seaweedfs (cle seaweedfs_s3_config).
    # Ne PAS laisser le chart generer ses propres identifiants : il utilise
    # lookup/randAlphaNum, que ArgoCD ne supporte pas (nouvelles cles a chaque sync).
    existingConfigSecret: seaweedfs-s3-config
    # Bucket cree par un Job post-install (hook PostSync cote ArgoCD)
    createBuckets:
      - name: mlflow

  service:
    type: NodePort
    nodePorts:
      s3: 30333
