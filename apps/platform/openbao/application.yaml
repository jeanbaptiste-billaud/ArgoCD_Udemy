apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infra
  source:
    repoURL: https://openbao.github.io/openbao-helm
    chart: openbao
    targetRevision: 0.30.3
    helm:
      valuesObject:
        server:
          dev:
            enabled: true
            devRootToken: "root"
          service:
            type: NodePort
            nodePort: 30200
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  # L'agent injector (vault-k8s) genere son certificat et injecte lui-meme
  # le caBundle dans son webhook : ArgoCD ne doit pas le comparer a Git.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true   # ne pas ecraser le caBundle au sync
