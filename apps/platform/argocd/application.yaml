# ArgoCD gere par lui-meme :
#   - source 1 : chart Helm argo-cd, avec les values de manifests/argocd/values.yaml
#   - source 2 : le repo Git, reference $values pour lire ces values
# Le premier install (values minimales) est fait par la branche bootstrap.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  # PAS de resources-finalizer : supprimer cette tuile ne doit jamais
  # desinstaller ArgoCD ni le reste du cluster.
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: infra
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.1.3          # meme version que install_ArgoCD.sh (branche bootstrap)
      helm:
        releaseName: argocd           # meme nom que le helm install initial
        valueFiles:
          - $values/manifests/argocd/values.yaml
    - repoURL: https://github.com/jeanbaptiste-billaud/ArgoCD_Udemy.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false                    # prudence : pas de prune sur ArgoCD lui-meme
      selfHeal: true
    syncOptions:
      - ServerSideApply=true          # CRDs ArgoCD trop grosses pour client-side apply
      - SkipDryRunOnMissingResource=true   # ServiceMonitor avant que Prometheus soit installe
