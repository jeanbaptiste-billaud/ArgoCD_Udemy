# SeaweedFS (S3) pour les artefacts MLflow : chart officiel en mode all-in-one
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # apres ESO (CRDs) et eso-config (ClusterSecretStore)
spec:
  project: infra
  sources:
    - repoURL: https://seaweedfs.github.io/seaweedfs/helm
      chart: seaweedfs
      targetRevision: 4.51.0          # 4.52.0 reference l'image chrislusf/seaweedfs:4.52, absente de Docker Hub
      helm:
        valueFiles:
          - $values/manifests/seaweedfs/values.yaml
    - repoURL: https://github.com/jeanbaptiste-billaud/ArgoCD_Udemy.git
      targetRevision: main
      ref: values                     # lecture de manifests/seaweedfs/values.yaml
    - repoURL: https://github.com/jeanbaptiste-billaud/ArgoCD_Udemy.git
      targetRevision: main
      path: workloads/seaweedfs       # ExternalSecret des identifiants S3
  destination:
    server: https://kubernetes.default.svc
    namespace: seaweedfs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
