# ===================================================================
# BOOTSTRAP — seul fichier applique a la main, une seule fois :
#   kubectl apply -f bootstrap/root-app.yaml
# Il cree :
#   1. l'AppProject "infra" utilise par toutes les Applications
#   2. l'Application racine "root-apps" qui synchronise apps/
# Ensuite, ce fichier est lui-meme gere par l'Application "argocd"
# (apps/argocd), donc toute modification passe par Git.
# ===================================================================
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Delete=false   # ne jamais supprimer le projet en cascade
spec:
  description: Composants plateforme (ArgoCD, secrets, monitoring)
  sourceRepos:
    - https://github.com/jeanbaptiste-billaud/ArgoCD_Udemy.git
    - https://argoproj.github.io/argo-helm
    - https://charts.external-secrets.io
    - https://openbao.github.io/openbao-helm
    - ghcr.io/prometheus-community/charts
  # Un namespace par application
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd            # ArgoCD + les Applications elles-memes
    - server: https://kubernetes.default.svc
      namespace: external-secrets  # operateur ESO
    - server: https://kubernetes.default.svc
      namespace: openbao           # OpenBao
    - server: https://kubernetes.default.svc
      namespace: monitoring        # kube-prometheus-stack
    - server: https://kubernetes.default.svc
      namespace: production        # ExternalSecret
    - server: https://kubernetes.default.svc
      namespace: kube-system       # composants systeme deployes par certains charts
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Delete=false   # protege toute l'arborescence
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://github.com/jeanbaptiste-billaud/ArgoCD_Udemy.git
    targetRevision: main
    path: apps
    directory:
      recurse: true
      # Prometheus n'est pas deploye automatiquement : appliquer a la main
      #   kubectl apply -f apps/platform/prometheus/application.yaml
      exclude: 'platform/prometheus/*'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
