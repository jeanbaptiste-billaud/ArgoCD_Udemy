# ===================================================================
# BOOTSTRAP — seul fichier applique a la main, une seule fois :
#   kubectl apply -f bootstrap/root-app.yaml
# Il cree :
#   1. l'Application "root-projects" qui synchronise projects/ (AppProjects)
#   2. l'Application racine "root-apps" qui synchronise apps/
# Ensuite, ce fichier est lui-meme gere par l'Application "argocd"
# (apps/argocd), donc toute modification passe par Git.
# ===================================================================
---
# Application 1 : sync les AppProjects (wave -1 pour exister avant tout).
# Projet "default" : "infra" n'existe pas encore tant que celle-ci n'a pas tourne.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-projects
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Delete=false   # protege les AppProjects
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jeanbaptiste-billaud/ArgoCD_Udemy.git
    targetRevision: main
    path: projects
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
# Application 2 : sync toutes les Applications platform (apps/)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Delete=false   # protege toute l'arborescence
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://github.com/jeanbaptiste-billaud/ArgoCD_Udemy.git
    targetRevision: main
    path: apps
    directory:
      recurse: true
      # Prometheus n'est pas deploye automatiquement : appliquer a la main
      #   kubectl apply -f apps/platform/prometheus/application.yaml
      exclude: 'platform/prometheus/*'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
