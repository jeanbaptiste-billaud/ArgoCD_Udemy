# ClusterSecretStore : OpenBao accessible depuis tous les namespaces
# (ressource cluster-scoped, pas de metadata.namespace)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-backend
spec:
  provider:
    vault:                       # OpenBao est compatible avec le provider Vault
      server: "http://openbao.openbao.svc:8200"   # DNS interne au cluster, stable
      path: "secret"             # moteur KV v2, active a la main (voir README)
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
          namespace: external-secrets   # obligatoire pour un ClusterSecretStore
