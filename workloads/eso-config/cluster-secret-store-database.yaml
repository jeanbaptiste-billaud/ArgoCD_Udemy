# ClusterSecretStore : moteur "database" d'OpenBao (identifiants PostgreSQL geres par OpenBao)
# version "v1" : lecture brute de database/<key>, sans le prefixe data/ du KV v2.
# Ex. key "static-creds/mlflow-role" -> GET database/static-creds/mlflow-role
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-database
spec:
  provider:
    vault:                       # OpenBao est compatible avec le provider Vault
      server: "http://openbao.openbao.svc:8200"
      path: "database"           # moteur database, active a la main (voir README)
      version: "v1"
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
          namespace: external-secrets
