# Identifiants du role "mlflow", lus dans OpenBao : secret/mlflow/postgres
# Modele pour une nouvelle base : copier le dossier databases/mlflow/ et remplacer "mlflow" partout.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-mlflow
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: db-mlflow
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: mlflow/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: mlflow/postgres
        property: password
