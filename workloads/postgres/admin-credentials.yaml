# Superutilisateur PostgreSQL lu dans OpenBao : secret/postgres/admin
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-admin
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: postgres-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: postgres/admin
        property: username
    - secretKey: password
      remoteRef:
        key: postgres/admin
        property: password
