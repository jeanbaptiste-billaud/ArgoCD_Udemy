# Identifiants PostgreSQL de MLflow (meme secret OpenBao que workloads/postgres/databases/mlflow.yaml)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-postgres-credentials
  namespace: mlflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: mlflow-postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: mlflow/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: mlflow/postgres
        property: password
---
# Identifiants S3 de MLflow : memes cles que SeaweedFS (OpenBao secret/seaweedfs/s3)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-s3-credentials
  namespace: mlflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: mlflow-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: seaweedfs/s3
        property: accessKey
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: seaweedfs/s3
        property: secretKey
---
# Acces externe a l'UI / API MLflow sur un NodePort fixe
apiVersion: v1
kind: Service
metadata:
  name: mlflow-nodeport
  namespace: mlflow
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/instance: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30500
