# Identifiants PostgreSQL de MLflow (meme secret OpenBao que workloads/postgres/databases/mlflow/)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-postgres-credentials
  namespace: mlflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: mlflow-postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: mlflow/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: mlflow/postgres
        property: password
