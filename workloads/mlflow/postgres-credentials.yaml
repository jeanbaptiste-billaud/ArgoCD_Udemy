# Identifiants PostgreSQL de MLflow : static role "mlflow-role" du moteur database d'OpenBao.
# OpenBao est le seul a connaitre le mot de passe du role "mlflow" et le change tout seul
# (rotation_period du static role) ; l'ExternalSecret suit ces rotations.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-postgres-credentials
  namespace: mlflow
spec:
  refreshInterval: 5m             # rattrape vite une rotation faite par OpenBao
  secretStoreRef:
    name: openbao-database
    kind: ClusterSecretStore
  target:
    name: mlflow-postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: static-creds/mlflow-role
        property: username
    - secretKey: password
      remoteRef:
        key: static-creds/mlflow-role
        property: password
