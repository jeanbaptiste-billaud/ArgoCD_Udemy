# Identifiants S3 de MLflow (identite "mlflow" de SeaweedFS).
# Amorcage UNIQUEMENT : cree le Secret a partir d'OpenBao (secret/seaweedfs/s3), puis
# ne le touche plus. Ensuite, le Secret Kubernetes fait foi : il est renvoye vers
# OpenBao par le PushSecret (s3-pushsecret.yaml), d'ou SeaweedFS lit ses identites.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-s3-credentials
  namespace: mlflow
spec:
  refreshPolicy: CreatedOnce      # cree le Secret s'il n'existe pas, ne le met jamais a jour
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: mlflow-s3-credentials
    creationPolicy: Orphan        # le Secret survit a la suppression de l'ExternalSecret
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: seaweedfs/s3
        property: accessKey
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: seaweedfs/s3
        property: secretKey
