# Cree la cle temporaire directement dans OpenBao, a cote des cles actives sans les ecraser :
#   secret/seaweedfs/s3 -> tempAccessKey
# Valeur produite par le generateur Password mlflow-s3-temp-key (s3-temp-generator.yaml).
# updatePolicy IfNotExists : la propriete n'est ecrite que si elle est absente, le
# generateur n'ecrase donc jamais une cle existante a chaque refresh.
# Meme prerequis que s3-pushsecret.yaml : metadonnee managed-by=external-secrets.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: mlflow-s3-temp-push
  namespace: mlflow
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists         # n'ecrit tempAccessKey que s'il n'existe pas encore
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao-backend
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: mlflow-s3-temp-key
  data:
    - match:
        secretKey: password         # cle produite par le generateur Password
        remoteRef:
          remoteKey: seaweedfs/s3
          property: tempAccessKey
