# Cree la paire de cles temporaire directement dans OpenBao, a cote des cles actives
# sans les ecraser :
#   secret/seaweedfs/s3 -> tempAccessKey, tempSecretKey
# Valeurs produites par le generateur Password mlflow-s3-temp-key (s3-temp-generator.yaml),
# qui genere une nouvelle paire a chaque push.
# Declenchement : refreshInterval 0 -> pousse a la creation, puis uniquement quand le
# PushSecret change (spec, labels, annotations). Chaque declenchement remplace donc
# la paire temporaire par une nouvelle, sans interaction directe avec OpenBao :
#   kubectl -n mlflow annotate pushsecret mlflow-s3-temp-push force-sync=$(date +%s) --overwrite
# Meme prerequis que s3-pushsecret.yaml : metadonnee managed-by=external-secrets.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: mlflow-s3-temp-push
  namespace: mlflow
spec:
  refreshInterval: 0s              # pas de refresh periodique : declenche par annotation
  updatePolicy: Replace             # chaque declenchement ecrase la paire temporaire
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao-backend
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: mlflow-s3-temp-key
  data:
    - match:
        secretKey: tempAccessKey
        remoteRef:
          remoteKey: seaweedfs/s3
          property: tempAccessKey
    - match:
        secretKey: tempSecretKey
        remoteRef:
          remoteKey: seaweedfs/s3
          property: tempSecretKey
