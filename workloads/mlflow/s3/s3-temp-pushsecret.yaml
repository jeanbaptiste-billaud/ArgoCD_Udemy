# Renvoie la cle temporaire (Secret Kubernetes mlflow-s3-temp, alimente par la future
# rotation) vers OpenBao, a cote des cles actives sans les ecraser :
#   secret/seaweedfs/s3 -> tempAccessKey
# Meme prerequis que s3-pushsecret.yaml : metadonnee managed-by=external-secrets.
# Tant que le Secret mlflow-s3-temp n'existe pas, ce PushSecret est en erreur (normal).
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: mlflow-s3-temp-push
  namespace: mlflow
spec:
  refreshInterval: 5m
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao-backend
      kind: ClusterSecretStore
  selector:
    secret:
      name: mlflow-s3-temp
  data:
    - match:
        secretKey: AWS_TEMP_ACCESS_KEY
        remoteRef:
          remoteKey: seaweedfs/s3
          property: tempAccessKey
