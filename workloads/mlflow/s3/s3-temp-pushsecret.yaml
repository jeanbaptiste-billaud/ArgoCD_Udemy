# Cree la paire S3 temporaire de rotation directement dans OpenBao, a cote de la paire
# officielle sans l'ecraser :
#   secret/seaweedfs/s3 -> tempAccessKey, tempSecretKey
# Valeurs produites par les generateurs de s3-generators.yaml (un PushSecret par generateur),
# regenerees a chaque push. Aucun Secret Kubernetes intermediaire.
# Declenchement : refreshInterval 0 -> pousse a la creation, puis uniquement quand le
# PushSecret change (spec, labels, annotations). updatePolicy Replace : chaque declenchement
# remplace la paire temporaire. Toujours declencher les DEUX ensemble, sans interaction
# directe avec OpenBao :
#   kubectl -n mlflow annotate pushsecret mlflow-s3-temp-access-push mlflow-s3-temp-secret-push \
#     force-sync=$(date +%s) --overwrite
# Meme prerequis que s3-pushsecret.yaml : metadonnee managed-by=external-secrets.
# Access key temporaire
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: mlflow-s3-temp-access-push
  namespace: mlflow
spec:
  refreshInterval: 0s
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao-backend
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: mlflow-s3-access-key
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: seaweedfs/s3
          property: tempAccessKey
---
# Secret key temporaire
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: mlflow-s3-temp-secret-push
  namespace: mlflow
spec:
  refreshInterval: 0s
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao-backend
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: mlflow-s3-secret-key
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: seaweedfs/s3
          property: tempSecretKey
