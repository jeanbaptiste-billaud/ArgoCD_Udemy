# Generateur de la paire de cles S3 temporaire de MLflow, consomme par s3-temp-pushsecret.yaml.
# Produit les deux cles en une fois. Les valeurs n'existent que dans OpenBao :
# aucun Secret Kubernetes n'est cree.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mlflow-s3-temp-key
  namespace: mlflow
spec:
  secretKeys:
    - tempAccessKey
    - tempSecretKey
  length: 40
  digits: 10
  symbols: 0                # cles S3 : alphanumeriques uniquement
  noUpper: false
  allowRepeat: true
