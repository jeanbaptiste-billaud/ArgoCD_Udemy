# Paire S3 temporaire de rotation, lue dans OpenBao (ecrite par s3-temp-pushsecret.yaml) :
#   secret/seaweedfs/s3 -> tempAccessKey, tempSecretKey
# Permet au job de rotation de la lire sans acces direct a OpenBao. Memes noms de cles que
# le Secret officiel mlflow-s3-credentials, pour la recopier telle quelle.
# refreshPolicy OnChange : mis a jour uniquement quand l'ExternalSecret change (spec,
# labels, annotations). Le job le declenche APRES la fin des push temporaires :
#   kubectl -n mlflow annotate externalsecret mlflow-s3-temp force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-s3-temp
  namespace: mlflow
spec:
  refreshPolicy: OnChange          # pas de refresh periodique : declenche par annotation
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: mlflow-s3-temp
    creationPolicy: Owner          # supprime avec l'ExternalSecret
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: seaweedfs/s3
        property: tempAccessKey
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: seaweedfs/s3
        property: tempSecretKey
