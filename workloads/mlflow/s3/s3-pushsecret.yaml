# Renvoie le Secret Kubernetes mlflow-s3-credentials (qui fait foi) vers OpenBao,
# aux memes emplacements que ceux lus par l'ExternalSecret d'amorcage (s3-credentials.yaml)
# et par la config S3 de SeaweedFS (workloads/seaweedfs/s3-credentials.yaml).
# Prerequis : secret/seaweedfs/s3 doit porter la metadonnee managed-by=external-secrets,
# sinon ESO refuse d'y ecrire (voir README).
# Declenchement : refreshInterval 0 -> pousse a la creation, puis uniquement quand le
# PushSecret change (spec, labels, annotations). La rotation le declenche via :
#   kubectl -n mlflow annotate pushsecret <nom> force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: mlflow-s3-credentials-push
  namespace: mlflow
spec:
  refreshInterval: 0s              # pas de refresh periodique : declenche par annotation
  updatePolicy: Replace           # ecrase la valeur existante dans OpenBao
  deletionPolicy: None            # supprimer le PushSecret ne supprime rien dans OpenBao
  secretStoreRefs:
    - name: openbao-backend
      kind: ClusterSecretStore
  selector:
    secret:
      name: mlflow-s3-credentials
  data:
    - match:
        secretKey: AWS_ACCESS_KEY_ID
        remoteRef:
          remoteKey: seaweedfs/s3
          property: accessKey
    - match:
        secretKey: AWS_SECRET_ACCESS_KEY
        remoteRef:
          remoteKey: seaweedfs/s3
          property: secretKey
