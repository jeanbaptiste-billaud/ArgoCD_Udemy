# Droits du job de rotation des cles S3 de MLflow (s3-rotation-cronjob.yaml).
# Limites aux objets touches par la rotation (resourceNames) quand l'API le permet.
# Attention : pods/exec sur SeaweedFS donne un acces complet a son conteneur (necessaire
# pour verifier le fichier de config monte et envoyer le SIGHUP).

apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow-s3-rotation
  namespace: mlflow
---
# Namespace mlflow : declenchements ESO, Secret officiel, redemarrage de MLflow
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlflow-s3-rotation
  namespace: mlflow
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["pushsecrets"]
    resourceNames: ["mlflow-s3-temp-access-push", "mlflow-s3-temp-secret-push", "mlflow-s3-credentials-push"]
    verbs: ["get", "patch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    resourceNames: ["mlflow-s3-temp"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mlflow-s3-temp"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mlflow-s3-credentials"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["mlflow"]
    verbs: ["patch"]                    # rollout restart
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]     # rollout status, exec deploy/mlflow
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]                   # verification de la cle chargee par MLflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-s3-rotation
  namespace: mlflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mlflow-s3-rotation
subjects:
  - kind: ServiceAccount
    name: mlflow-s3-rotation
    namespace: mlflow
---
# Namespace seaweedfs : config S3 et rechargement par SIGHUP
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlflow-s3-rotation
  namespace: seaweedfs
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    resourceNames: ["seaweedfs-s3-config"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["seaweedfs-s3-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch"]     # patch : annotation qui force kubelet a resynchroniser le volume
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]                   # sha256sum du fichier monte + kill -HUP 1
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]                      # confirmation du rechargement
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-s3-rotation
  namespace: seaweedfs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mlflow-s3-rotation
subjects:
  - kind: ServiceAccount
    name: mlflow-s3-rotation
    namespace: mlflow
