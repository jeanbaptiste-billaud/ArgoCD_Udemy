# Job de rotation des cles S3 de MLflow.
# Le code vit sur la branche orpheline "pyeso" (package pyESO + s3_rotation/) :
#   - init container : clone de la branche dans un emptyDir ;
#   - conteneur principal (image uv) : installe les dependances figees par uv.lock et lance
#     s3_rotation/rotate_mlflow.py. Pas d'image a construire.
# Etapes (chacune attend la fin de la precedente, arret a la premiere erreur) :
#   1. nouvelle paire temporaire           (PushSecrets mlflow-s3-temp-*-push)
#   2. lecture de la paire temporaire      (ExternalSecret mlflow-s3-temp)
#   3. SeaweedFS accepte les deux paires   (ExternalSecret seaweedfs-s3-config + SIGHUP)
#   4. verification de la paire temporaire (appel S3 signe)
#   5. paire temporaire -> Secret officiel mlflow-s3-credentials
#   6. push officiel                       (PushSecret mlflow-s3-credentials-push)
#   7. MLflow redemarre sur la nouvelle paire, PUIS revocation de l'ancienne (SIGHUP)
#   8. verifications finales
# Les cles ne sont jamais affichees : les logs ne montrent que des empreintes sha256.
# Lancement manuel :
#   kubectl -n mlflow create job --from=cronjob/mlflow-s3-rotation mlflow-s3-rotation-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mlflow-s3-rotation
  namespace: mlflow
spec:
  schedule: "0 3 1 * *"              # le 1er de chaque mois a 03:00
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid          # jamais deux rotations en parallele
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0                # pas de relance automatique : une rotation interrompue
                                     # se diagnostique avant d'etre relancee
      activeDeadlineSeconds: 900
      template:
        spec:
          serviceAccountName: mlflow-s3-rotation
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: clone
              image: alpine/git:2.52.0
              args:
                - clone
                - --depth=1
                - --single-branch
                - --branch=pyeso
                - https://github.com/jeanbaptiste-billaud/ArgoCD_Udemy.git
                - /src
              env:
                - name: HOME
                  value: /tmp
              securityContext: &restricted
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: src
                  mountPath: /src
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: rotate
              image: ghcr.io/astral-sh/uv:0.13.5-python3.14-trixie-slim
              workingDir: /src
              command: ["uv", "run", "--frozen", "--no-install-project", "s3_rotation/rotate_mlflow.py"]
              env:
                - name: PYTHONPATH                # pyESO importe depuis le clone
                  value: /src
                - name: UV_PROJECT_ENVIRONMENT    # venv et cache hors du rootfs en lecture seule
                  value: /tmp/venv
                - name: UV_CACHE_DIR
                  value: /tmp/uv-cache
                - name: UV_PYTHON_DOWNLOADS       # Python de l'image
                  value: never
                - name: HOME
                  value: /tmp
                - name: PYTHONUNBUFFERED
                  value: "1"
              securityContext: *restricted
              volumeMounts:
                - name: src
                  mountPath: /src
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: src
              emptyDir: {}
            - name: tmp
              emptyDir: {}
