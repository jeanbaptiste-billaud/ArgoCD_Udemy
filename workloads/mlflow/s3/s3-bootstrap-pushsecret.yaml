# Amorce les cles S3 de MLflow directement dans OpenBao, sans intervention manuelle :
#   secret/seaweedfs/s3 -> accessKey, secretKey
# Valeurs produites par le generateur Password mlflow-s3-key (s3-bootstrap-generator.yaml).
# Si le chemin n'existe pas, ESO le cree avec la metadonnee managed-by=external-secrets,
# ce qui autorise ensuite les autres PushSecrets a y ecrire.
# updatePolicy IfNotExists : chaque propriete n'est ecrite que si elle est absente, ce
# PushSecret n'ecrase donc jamais des cles existantes (la rotation passe par
# mlflow-s3-credentials-push). refreshInterval 0 : un seul passage a la creation.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: mlflow-s3-bootstrap-push
  namespace: mlflow
spec:
  refreshInterval: 0s              # pas de refresh periodique
  updatePolicy: IfNotExists         # ne cree que les proprietes absentes
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao-backend
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: mlflow-s3-key
  data:
    - match:
        secretKey: accessKey
        remoteRef:
          remoteKey: seaweedfs/s3
          property: accessKey
    - match:
        secretKey: secretKey
        remoteRef:
          remoteKey: seaweedfs/s3
          property: secretKey
