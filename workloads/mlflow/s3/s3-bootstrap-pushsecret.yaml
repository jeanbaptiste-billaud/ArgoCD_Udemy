# Amorce la paire S3 officielle de MLflow directement dans OpenBao, sans intervention manuelle :
#   secret/seaweedfs/s3 -> accessKey, secretKey
# Valeurs produites par les generateurs de s3-generators.yaml (un PushSecret par generateur).
# Si le chemin n'existe pas, ESO le cree avec la metadonnee managed-by=external-secrets,
# ce qui autorise ensuite les autres PushSecrets a y ecrire.
# updatePolicy IfNotExists : chaque propriete n'est ecrite que si elle est absente, ces
# PushSecrets n'ecrasent donc JAMAIS la paire officielle (la rotation passe par la paire
# temporaire, puis mlflow-s3-credentials-push). refreshInterval 0 : un seul passage a la creation.
# Access key officielle
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: mlflow-s3-bootstrap-access-push
  namespace: mlflow
spec:
  refreshInterval: 0s
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao-backend
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: mlflow-s3-access-key
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: seaweedfs/s3
          property: accessKey
---
# Secret key officielle
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: mlflow-s3-bootstrap-secret-push
  namespace: mlflow
spec:
  refreshInterval: 0s
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao-backend
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: mlflow-s3-secret-key
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: seaweedfs/s3
          property: secretKey
