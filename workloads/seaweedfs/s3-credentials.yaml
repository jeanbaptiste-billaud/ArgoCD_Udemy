# Configuration S3 de SeaweedFS generee a partir d'OpenBao :
#   - admin  : secret/seaweedfs/admin (accessKey, secretKey) -> tous les droits, tous les buckets
#   - mlflow : secret/seaweedfs/s3    (accessKey, secretKey) -> bucket "mlflow" uniquement
#              + paire temporaire de rotation (tempAccessKey, tempSecretKey), memes droits
# Lu uniquement au demarrage de SeaweedFS : apres un changement, redemarrer le pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3-config
  namespace: seaweedfs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: seaweedfs-s3-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Format attendu par "weed s3 -config" (cle imposee par le chart)
        seaweedfs_s3_config: |
          {
            "identities": [
              {
                "name": "admin",
                "credentials": [
                  { "accessKey": "{{ .adminAccessKey }}", "secretKey": "{{ .adminSecretKey }}" }
                ],
                "actions": ["Admin", "Read", "Write", "List", "Tagging"]
              },
              {
                "name": "mlflow",
                "credentials": [
                  { "accessKey": "{{ .mlflowAccessKey }}", "secretKey": "{{ .mlflowSecretKey }}" },
                  { "accessKey": "{{ .mlflowTempAccessKey }}", "secretKey": "{{ .mlflowTempSecretKey }}" }
                ],
                "actions": ["Read:mlflow", "Write:mlflow", "List:mlflow", "Tagging:mlflow"]
              }
            ]
          }
  data:
    - secretKey: adminAccessKey
      remoteRef:
        key: seaweedfs/admin
        property: accessKey
    - secretKey: adminSecretKey
      remoteRef:
        key: seaweedfs/admin
        property: secretKey
    - secretKey: mlflowAccessKey
      remoteRef:
        key: seaweedfs/s3
        property: accessKey
    - secretKey: mlflowSecretKey
      remoteRef:
        key: seaweedfs/s3
        property: secretKey
    # Paire temporaire de rotation (workloads/mlflow/s3/s3-temp-pushsecret.yaml)
    - secretKey: mlflowTempAccessKey
      remoteRef:
        key: seaweedfs/s3
        property: tempAccessKey
    - secretKey: mlflowTempSecretKey
      remoteRef:
        key: seaweedfs/s3
        property: tempSecretKey
