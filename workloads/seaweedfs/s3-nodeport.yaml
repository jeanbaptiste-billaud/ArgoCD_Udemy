# Acces externe a la passerelle S3 uniquement, sur un NodePort fixe
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3-nodeport
  namespace: seaweedfs
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: seaweedfs
    app.kubernetes.io/component: seaweedfs-all-in-one
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
      nodePort: 30333
