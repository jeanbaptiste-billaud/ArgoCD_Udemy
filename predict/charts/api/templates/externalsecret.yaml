{{- if .Values.database.enabled }}
# Identifiants PostgreSQL de l'environnement : static role du moteur database d'OpenBao.
# OpenBao change le mot de passe tout seul ; Reloader redemarre l'API quand le Secret change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "api.dbSecret" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.database.refreshInterval }}
  secretStoreRef:
    name: openbao-database
    kind: ClusterSecretStore
  target:
    name: {{ include "api.dbSecret" . }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: static-creds/{{ required "api.database.staticRole est obligatoire" .Values.database.staticRole }}
        property: username
    - secretKey: password
      remoteRef:
        key: static-creds/{{ .Values.database.staticRole }}
        property: password
{{- end }}
